<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gieo Quẻ Đầu Năm - Siêu Troll</title>

<!-- Nhạc nền SoundCloud (ẩn) -->
<iframe width="0" height="0"
  scrolling="no" frameborder="no"
  allow="autoplay"
  src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/t-tu-n-804367758/nhac-xo-so-kien-thiet-mien-bac-ban-kinh-dien&auto_play=true">
</iframe>

<style>
:root{
  --red1:#7f1d1d;
  --red2:#dc2626;
  --gold:#facc15;
  --text:#fff7ed;
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  font-family:system-ui, sans-serif;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  background:
    radial-gradient(circle at 20% 30%, #facc1533 0%, transparent 40%),
    radial-gradient(circle at 80% 20%, #fde04722 0%, transparent 45%),
    linear-gradient(135deg, var(--red1), var(--red2));
}

/* Hoa Tết */
body::before{
  content:"🌸 🌼 🌸 🌼 🌸 🌼 🌸 🌼 🌸 🌼";
  position:absolute;
  top:15px;
  width:100%;
  text-align:center;
  font-size:26px;
  opacity:.4;
}

.card{
  width:min(650px,92vw);
  background:rgba(120,0,0,.88);
  border:2px solid var(--gold);
  border-radius:24px;
  padding:28px;
  text-align:center;
  box-shadow:0 0 40px #facc1544;
  position:relative;
}

h1{
  color:var(--gold);
  margin:0 0 10px;
}

.range{
  font-size:14px;
  opacity:.8;
  margin-bottom:18px;
}

/* Bao lì xì */
.envelope-wrapper{
  position:relative;
  width:140px;
  height:180px;
  margin:0 auto 16px;
  perspective:1000px;
}

.envelope{
  width:100%;
  height:100%;
  background:linear-gradient(145deg,#b91c1c,#dc2626);
  border:3px solid var(--gold);
  border-radius:12px;
  position:relative;
  cursor:pointer;
  transition:transform .25s ease;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
}

/* Chữ trên bao */
.envelope .seal{
  font-size:36px;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));
}

.envelope:hover{
  transform:scale(1.05);
}

/* Nắp bao */
.flap{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:55%;
  background:#991b1b;
  border-bottom:2px solid var(--gold);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;
  transition:transform .65s ease;
  z-index:3;
}

/* Tờ "quẻ" bên trong */
.paper{
  position:absolute;
  left:50%;
  bottom:14px;
  transform:translateX(-50%) translateY(70px);
  width:78%;
  height:78%;
  border-radius:12px;
  background:linear-gradient(180deg, #fff7ed, #fde68a);
  box-shadow:0 10px 25px rgba(0,0,0,.35);
  z-index:1;
  opacity:0;
  transition:transform .65s ease, opacity .45s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#7f1d1d;
  font-weight:900;
  letter-spacing:.5px;
  font-size:18px;
}

/* Confetti đơn giản */
.confetti{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  z-index:4;
}

@keyframes confettiPop{
  0%{ transform:scale(.7); opacity:0; }
  20%{ opacity:1; }
  100%{ transform:scale(1.2); opacity:0; }
}

.confetti.show{
  animation:confettiPop .9s ease forwards;
}

/* Rung nhẹ */
@keyframes shake{
  0%{transform:rotate(0deg);}
  25%{transform:rotate(2deg);}
  50%{transform:rotate(-2deg);}
  75%{transform:rotate(1deg);}
  100%{transform:rotate(0deg);}
}
.envelope.shake{
  animation:shake .38s ease;
}

/* Khi mở */
.envelope.open .flap{
  transform:rotateX(180deg);
}
.envelope.open + .paper{
  transform:translateX(-50%) translateY(-8px);
  opacity:1;
}

/* Quẻ (hiển thị kiểu gõ chữ) */
.wish{
  font-size:20px;
  margin:16px 0 10px;
  min-height:80px;
  line-height:1.35;
}

/* Nút */
button{
  background:linear-gradient(45deg,#fde047,#facc15);
  border:none;
  padding:14px 22px;
  border-radius:16px;
  font-weight:bold;
  cursor:pointer;
  font-size:16px;
  color:#7f1d1d;
  transition:.2s;
}
button:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #fde047;
}

/* Ảnh troll */
.troll-img{
  margin-top:12px;
  min-height:220px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.troll-img img{
  max-width:100%;
  max-height:240px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
  display:none;
  animation: pop .3s ease;
}
@keyframes pop{
  from{ transform:scale(.7); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}

/* Gợi ý nhỏ */
.hint{
  font-size:13px;
  opacity:.75;
  margin-top:6px;
}

/* Con trỏ nhấp nháy cho hiệu ứng gõ */
.cursor{
  display:inline-block;
  width:10px;
  margin-left:2px;
  animation: blink 1s step-end infinite;
}
@keyframes blink{
  50%{ opacity:0; }
}
</style>
</head>

<body>

<div class="card">
  <h1>🔮 Gieo Quẻ Đầu Năm</h1>
  <div class="range">Tỉ lệ linh nghiệm: tuỳ tâm trạng vũ trụ (và wifi)</div>

  <!-- Bao "gieo quẻ" (click cũng mở được) -->
  <div class="envelope-wrapper">
    <div class="envelope" id="envelope" onclick="openEnvelope()">
      <div class="flap"></div>
      <div class="seal">Gieo</div>
      <div class="confetti" id="confetti">✨🎊✨🎉✨🎊✨</div>
    </div>
    <div class="paper" id="paper">QUẺ</div>
  </div>
  <div class="hint">Bấm nút hoặc bấm vào “bao” để gieo quẻ 🔮</div>

  <div class="wish" id="wishText">
    Bấm để gieo quẻ đầu năm!
  </div>

  <div class="troll-img">
    <img id="trollImage" src="" alt="meme troll">
  </div>

  <button onclick="openEnvelope()">Gieo quẻ 🔮</button>
</div>

<script>
const wishes = [
  "🧧 Quẻ Khai Xuân: Năm nay tiền vào cửa trước, ra cửa sau… nhưng cửa sau là đi mua quà Tết cho gia đình nên thôi cũng đáng 😌 Lộc không ào ào nhưng đều đều như lì xì mùng 1, đủ vui cả năm.",
  
  "🐉 Quẻ Rồng Bay Ngày Tết: Sự nghiệp năm nay bay cao như pháo hoa giao thừa… chỉ cần nhớ cúi đầu khi qua cửa kẻo đụng trần vì thành công đến hơi nhanh 😏",
  
  "💘 Quẻ Đào Hoa Đầu Năm: Tết này có người để ý bạn thật đó… dù họ đang để ý thêm vài người khác 😆 Nhưng biết đâu sau mấy ngày chúc Tết, bạn lại là người được chọn lì xì trái tim.",
  
  "💸 Quẻ Tài Lộc Xuân: Có lộc nhỏ nhỏ ghé thăm, kiểu đủ mua trà sữa size M không topping… nhưng cuối năm nhìn lại vẫn thấy mình dư được một chút vì biết tiết kiệm từ mùng 2 🥲",
  
  "🔥 Quẻ Vận Đỏ: Đỏ cả năm, đỏ từ phong bao lì xì tới bảng thông báo 'nhận tiền thành công'… còn thông báo 'trừ tiền' thì coi như cúng đầu năm cho xui nó đi hết 💀",
  
  "🧠 Quẻ Khôn Ngoan: Bạn sẽ thông minh hơn hẳn sau Tết… vì đã kịp ngu vài lần khi mua đồ giảm giá mà không coi kỹ 🤣 Nhưng không sao, năm mới học được thêm bài học là đã lời.",
  
  "🏃 Quẻ Nỗ Lực Khai Niên: Cố gắng từ mùng 1 thì cả năm hanh thông… còn không cố thì thành người từng hứa sẽ cố sau Tết 😌 Nhưng thôi, bắt đầu lại lúc nào cũng chưa muộn.",
  
  "🎯 Quẻ Mục Tiêu Đầu Xuân: Đặt mục tiêu cao như chậu mai trước cửa… dù không đạt hết thì ít nhất cũng có cái để khoe với họ hàng ngày mùng 3 😏",
  
  "🪞 Quẻ Tân Niên Tỉnh Thức: Người bạn cần thay đổi nhất trong năm mới… đang nhìn bạn khi bạn soi gương sửa tóc đi chúc Tết 🫠 Nhưng chỉ cần thay đổi chút mỗi ngày là vận may cũng đổi theo.",
  
  "🎲 Quẻ Hên Xui Ngày Xuân: 50% may mắn do trời, 50% do bạn… mà bạn thì lúc hên lúc xui 😆 Nhưng đầu năm cứ vui vẻ, thần Tài thấy thương là tự động cộng thêm điểm.",
  
  "💍 Quẻ Duyên Lành: Có cưới đó… cưới ai thì trời chưa cập nhật phiên bản Tết này 🤭 Nhưng khả năng cao là sẽ gặp đúng người vào một ngày tưởng chừng chỉ đi ăn Tết cho vui.",
  
  "📉 Quẻ Ví Mỏng: Ví có thể mỏng đi sau Tết vì lì xì quá tay… nhưng lòng dày lên vì được yêu thương 😌 Năm nay tiền có thể không nhiều, nhưng niềm vui thì không thiếu.",
  
  "🌪 Quẻ Drama Xuân: Bạn không tìm drama… drama vẫn tìm bạn trong mấy buổi họp mặt đầu năm 😭 Nhưng yên tâm, bạn chỉ đóng vai cameo chứ không phải nhân vật chính.",
  
  "🚀 Quẻ Bứt Phá Khai Xuân: Năm nay có bứt phá thật, bứt khỏi vùng an toàn và phá luôn giới hạn cũ 🤡 Nghe hơi đáng sợ nhưng đó là cách vũ trụ lì xì cho bạn một phiên bản xịn hơn.",
  
  "🍀 Quẻ Bình An: Không cần giàu nhất xóm, không cần nổi bật nhất họ… chỉ cần cả năm mạnh khỏe, gia đình sum vầy, cuối năm vẫn ngồi ăn bánh chưng cười vui là đã trúng quẻ tốt rồi 😌"
];

const trollImages = [
  "https://images.unsplash.com/photo-1549068106-b024baf5062d", // lì xì đỏ
  "https://images.unsplash.com/photo-1582562124811-c09040d0a901", // hoa mai vàng
  "https://images.unsplash.com/photo-1576086213369-97a306d36557", // hoa đào Tết
  "https://images.unsplash.com/photo-1513151233558-d860c5398176", // pháo hoa
  "https://images.unsplash.com/photo-1608889175123-8ee362201f81", // bánh chưng
  "https://images.unsplash.com/photo-1608889825205-eebdb9fc5806", // trang trí Tết đỏ vàng
  "https://images.unsplash.com/photo-1579547621706-1a9c79d5c9f1", // thần tài tượng vàng
  "https://images.unsplash.com/photo-1517841905240-472988babdf9", // mèo vàng may mắn
  "https://images.unsplash.com/photo-1520975922326-6f72cbb3e4d8", // bao lì xì cận cảnh
  "https://images.unsplash.com/photo-1485908510055-98fdbb8b9c55", // đèn lồng đỏ
  "https://images.unsplash.com/photo-1504198453319-5ce911bafcde", // chúc mừng năm mới
  "https://images.unsplash.com/photo-1543253539-0b2bfe8b0c4b", // gia đình sum vầy
  "https://images.unsplash.com/photo-1511795409834-ef04bbd61622", // tiệc Tết
  "https://images.unsplash.com/photo-1517263904808-5dc91e3e7044", // tiền vàng tài lộc
  "https://images.unsplash.com/photo-1506744038136-46273834b3fb", // phong bao đỏ
  "https://images.unsplash.com/photo-1492684223066-81342ee5ff30"  // countdown năm mới
];
let typingTimer = null;

// Key lưu “đã gieo” (đổi tên key nếu muốn reset theo năm)
const STORAGE_KEY = "fortune_once_v1";

/** Lấy quẻ đã lưu (nếu có) */
function getSavedFortune(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(typeof data?.index !== "number") return null;
    return data;
  }catch(e){
    return null;
  }
}

/** Lưu quẻ */
function saveFortune(index){
  const data = {
    index,
    savedAt: new Date().toISOString()
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

/** Hiển thị quẻ với hiệu ứng gõ chữ */
function typeText(fullText, onDone){
  const textEl = document.getElementById("wishText");
  textEl.innerHTML = `<span id="typed"></span><span class="cursor">|</span>`;
  const typedEl = document.getElementById("typed");

  let i = 0;
  if (typingTimer) clearInterval(typingTimer);

  typingTimer = setInterval(()=>{
    typedEl.textContent = fullText.slice(0, i + 1);
    i++;
    if(i >= fullText.length){
      clearInterval(typingTimer);
      typingTimer = null;
      if(onDone) onDone();
    }
  }, 25);
}

/** Hiển thị meme theo index (cố định) */
function showImageByIndex(index){
  const img = document.getElementById("trollImage");
  const imageIndex = index % trollImages.length;
  img.src = trollImages[imageIndex];
  img.style.display = "block";
}

/** Mở bao + show quẻ */
function animateOpenThenShow(index){
  const envelope = document.getElementById("envelope");
  const paper = document.getElementById("paper");
  const confetti = document.getElementById("confetti");

  // reset animation (nhưng KHÔNG reset quẻ)
  envelope.classList.remove("open");
  paper.style.opacity = 0;
  confetti.classList.remove("show");

  // rung
  envelope.classList.add("shake");

  setTimeout(()=>{
    envelope.classList.remove("shake");
    envelope.classList.add("open");
    confetti.classList.add("show");

    setTimeout(()=>{
      paper.style.opacity = 1;
      paper.textContent = "QUẺ";

      const fullText = wishes[index];
      typeText(fullText, ()=> showImageByIndex(index));
    }, 380);

  }, 380);
}

/** Bấm gieo: chỉ cho 1 lần */
function openEnvelope(){
  const saved = getSavedFortune();

  if(saved){
    // 🚫 Đã gieo rồi -> KHÔNG cho gieo nữa
    const textEl = document.getElementById("wishText");
    textEl.innerHTML = "🛑 Bạn đã gieo quẻ rồi nha! Đừng tham, coi chừng ứng nghiệm 😌";
    // vẫn cho xem lại quẻ cũ bằng cách mở lại animation (tuỳ bạn)
    // Nếu bạn muốn “cấm tuyệt đối” (không mở lại luôn) thì COMMENT dòng dưới.
    animateOpenThenShow(saved.index);
    return;
  }

  // ✅ Lần đầu: random, lưu lại, rồi mở
  const index = Math.floor(Math.random() * wishes.length);
  saveFortune(index);
  animateOpenThenShow(index);

  // Khoá nút luôn cho đúng “không cho gieo nữa”
  const btn = document.querySelector("button");
  if(btn){
    btn.disabled = true;
    btn.textContent = "Đã gieo quẻ ✅";
    btn.style.opacity = .85;
    btn.style.cursor = "not-allowed";
  }
}

// Nếu bạn muốn: load trang lên là tự hiện trạng thái “đã gieo” (không cần bấm)
// thì bỏ comment đoạn dưới:
window.addEventListener("load", ()=>{
  const saved = getSavedFortune();
  if(saved){
    const btn = document.querySelector("button");
    if(btn){
      btn.disabled = true;
      btn.textContent = "Đã gieo quẻ ✅";
      btn.style.opacity = .85;
      btn.style.cursor = "not-allowed";
    }
    // Có thể auto show lại quẻ cũ:
    // animateOpenThenShow(saved.index);
  }
});
</script>
</body>
</html>
