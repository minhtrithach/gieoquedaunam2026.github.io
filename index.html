<style>
:root{
  --red1:#7f1d1d;
  --red2:#dc2626;
  --gold:#facc15;
  --text:#fff7ed;
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  font-family:system-ui, sans-serif;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  background:
    radial-gradient(circle at 20% 30%, #facc1533 0%, transparent 40%),
    radial-gradient(circle at 80% 20%, #fde04722 0%, transparent 45%),
    linear-gradient(135deg, var(--red1), var(--red2));
}

/* Hoa Tết */
body::before{
  content:"🌸 🌼 🌸 🌼 🌸 🌼 🌸 🌼 🌸 🌼";
  position:absolute;
  top:15px;
  width:100%;
  text-align:center;
  font-size:26px;
  opacity:.4;
}

.card{
  width:min(650px,92vw);
  background:rgba(120,0,0,.88);
  border:2px solid var(--gold);
  border-radius:24px;
  padding:28px;
  text-align:center;
  box-shadow:0 0 40px #facc1544;
  position:relative;
}

h1{
  color:var(--gold);
  margin:0 0 10px;
}

.range{
  font-size:14px;
  opacity:.8;
  margin-bottom:18px;
}

/* Bao lì xì */
.envelope-wrapper{
  position:relative;
  width:140px;
  height:180px;
  margin:0 auto 16px;
  perspective:1000px;
}

.envelope{
  width:100%;
  height:100%;
  background:linear-gradient(145deg,#b91c1c,#dc2626);
  border:3px solid var(--gold);
  border-radius:12px;
  position:relative;
  cursor:pointer;
  transition:transform .25s ease;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
}

/* Chữ trên bao */
.envelope .seal{
  font-size:36px;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));
}

.envelope:hover{
  transform:scale(1.05);
}

/* Nắp bao */
.flap{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:55%;
  background:#991b1b;
  border-bottom:2px solid var(--gold);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;
  transition:transform .65s ease;
  z-index:3;
}

/* Tờ "quẻ" bên trong */
.paper{
  position:absolute;
  left:50%;
  bottom:14px;
  transform:translateX(-50%) translateY(70px);
  width:78%;
  height:78%;
  border-radius:12px;
  background:linear-gradient(180deg, #fff7ed, #fde68a);
  box-shadow:0 10px 25px rgba(0,0,0,.35);
  z-index:1;
  opacity:0;
  transition:transform .65s ease, opacity .45s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#7f1d1d;
  font-weight:900;
  letter-spacing:.5px;
  font-size:18px;
}

/* Confetti đơn giản */
.confetti{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  z-index:4;
}

@keyframes confettiPop{
  0%{ transform:scale(.7); opacity:0; }
  20%{ opacity:1; }
  100%{ transform:scale(1.2); opacity:0; }
}

.confetti.show{
  animation:confettiPop .9s ease forwards;
}

/* Rung nhẹ */
@keyframes shake{
  0%{transform:rotate(0deg);}
  25%{transform:rotate(2deg);}
  50%{transform:rotate(-2deg);}
  75%{transform:rotate(1deg);}
  100%{transform:rotate(0deg);}
}
.envelope.shake{
  animation:shake .38s ease;
}

/* Khi mở */
.envelope.open .flap{
  transform:rotateX(180deg);
}
.envelope.open + .paper{
  transform:translateX(-50%) translateY(-8px);
  opacity:1;
}

/* Quẻ (hiển thị kiểu gõ chữ) */
.wish{
  font-size:20px;
  margin:16px 0 10px;
  min-height:80px;
  line-height:1.35;
}

/* Phần giải quẻ */
.detail{
  margin-top:10px;
  padding:12px 14px;
  border-radius:16px;
  border:1px solid #fde04755;
  background:rgba(255,255,255,.06);
  font-size:15px;
  line-height:1.55;
  color:#fde68a;
  white-space:pre-line;
  opacity:0;
  transform:translateY(6px);
  transition:opacity .45s ease, transform .45s ease;
  text-align:left;
}
.detail.show{
  opacity:1;
  transform:translateY(0);
}

/* Nút */
button{
  background:linear-gradient(45deg,#fde047,#facc15);
  border:none;
  padding:14px 22px;
  border-radius:16px;
  font-weight:bold;
  cursor:pointer;
  font-size:16px;
  color:#7f1d1d;
  transition:.2s;
}
button:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #fde047;
}

/* Ảnh troll */
.troll-img{
  margin-top:12px;
  min-height:220px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.troll-img img{
  max-width:100%;
  max-height:240px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
  display:none;
  animation: pop .3s ease;
}
@keyframes pop{
  from{ transform:scale(.7); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}

/* Gợi ý nhỏ */
.hint{
  font-size:13px;
  opacity:.75;
  margin-top:6px;
}

/* Con trỏ nhấp nháy cho hiệu ứng gõ */
.cursor{
  display:inline-block;
  width:10px;
  margin-left:2px;
  animation: blink 1s step-end infinite;
}
@keyframes blink{
  50%{ opacity:0; }
}
</style>
</head>

• Lời nhắc: Bình tĩnh là kỹ năng kiếm tiền bền nhất.`,
  `🔎 Giải quẻ 2 – Bình Minh Mới
• Tổng quan: Vòng lặp cũ khép lại, bạn có cơ hội làm lại theo cách trưởng thành hơn.
• Công việc: Thử lại dự án từng dang dở; lần này hãy tối ưu quy trình và kỷ luật.

  /* ... tiếp tục tới quẻ 69 (giữ nguyên như bạn đã paste) ... */
  `🔎 Giải quẻ 69 – Troll Kết Sổ
• Tổng quan: Nếu quẻ nào không trúng… thì trúng chắc 1 điều: bạn còn cơ hội làm lại 😌
• Công việc: Năm nay có lúc lỡ nhịp; nhưng bạn quay lại đường đúng rất nhanh.
• Tài chính: Có lúc hụt; nhưng bạn rút kinh nghiệm, càng về sau càng ổn.
• Tình cảm & sức khỏe: Đừng tự trách; đời cho bạn “reset” nhiều lần.

let typingTimer = null;

/* Key lưu “đã gieo” */
const STORAGE_KEY = "fortune_once_v1";

function getSavedFortune(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(typeof data?.index !== "number") return null;
    return data;
  }catch(e){
    return null;
  }
}

function saveFortune(index){
  const data = { index, savedAt: new Date().toISOString() };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function resetDetail(){
  const detailEl = document.getElementById("detailText");
  detailEl.classList.remove("show");
  detailEl.textContent = "";
}

/* Hiển thị quẻ với hiệu ứng gõ chữ */
function typeText(fullText, onDone){
  const textEl = document.getElementById("wishText");
  textEl.innerHTML = `<span id="typed"></span><span class="cursor">|</span>`;
  const typedEl = document.getElementById("typed");

  let i = 0;
  if (typingTimer) clearInterval(typingTimer);

  typingTimer = setInterval(()=>{
    typedEl.textContent = fullText.slice(0, i + 1);
    i++;
    if(i >= fullText.length){
      clearInterval(typingTimer);
      typingTimer = null;
      if(onDone) onDone();
    }
  }, 25);
}

/* Hiển thị meme theo index + show giải quẻ */
function showImageAndDetail(index){
  const img = document.getElementById("trollImage");
  const imageIndex = index % trollImages.length;
  img.src = trollImages[imageIndex];
  img.style.display = "block";

  const detailEl = document.getElementById("detailText");
  detailEl.textContent = wishDetails[index] || "🔎 (Chưa có giải quẻ cho quẻ này)";
  detailEl.classList.add("show");
}

/* Mở bao + show quẻ */
function animateOpenThenShow(index){
  const envelope = document.getElementById("envelope");
  const paper = document.getElementById("paper");
  const confetti = document.getElementById("confetti");

  resetDetail();

  envelope.classList.remove("open");
  paper.style.opacity = 0;
  confetti.classList.remove("show");

  envelope.classList.add("shake");

  setTimeout(()=>{
    envelope.classList.remove("shake");
    envelope.classList.add("open");
    confetti.classList.add("show");

    setTimeout(()=>{
      paper.style.opacity = 1;
      paper.textContent = "QUẺ";

      const fullText = wishes[index];
      typeText(fullText, ()=> showImageAndDetail(index));
    }, 380);

  }, 380);
}

/* Bấm gieo: chỉ cho 1 lần */
function openEnvelope(){
  const saved = getSavedFortune();

  if(saved){
    const textEl = document.getElementById("wishText");
    textEl.innerHTML = "🛑 Bạn đã gieo quẻ rồi nha! Đừng tham, coi chừng ứng nghiệm 😌";
    animateOpenThenShow(saved.index);
    return;
  }

  const index = Math.floor(Math.random() * wishes.length);
  saveFortune(index);
  animateOpenThenShow(index);

  const btn = document.getElementById("btnFortune");
  if(btn){
    btn.disabled = true;
    btn.textContent = "Đã gieo quẻ ✅";
    btn.style.opacity = .85;
    btn.style.cursor = "not-allowed";
  }
}

window.addEventListener("load", ()=>{
  const saved = getSavedFortune();
  if(saved){
    const btn = document.getElementById("btnFortune");
    if(btn){
      btn.disabled = true;
      btn.textContent = "Đã gieo quẻ ✅";
      btn.style.opacity = .85;
      btn.style.cursor = "not-allowed";
    }
    // Nếu muốn tự show lại quẻ cũ khi load trang:
    // animateOpenThenShow(saved.index);
  }
});
</script>
