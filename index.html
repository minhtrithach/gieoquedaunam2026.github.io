<style>
:root{
  --red1:#7f1d1d;
  --red2:#dc2626;
  --gold:#facc15;
  --text:#fff7ed;
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  font-family:system-ui, sans-serif;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  background:
    radial-gradient(circle at 20% 30%, #facc1533 0%, transparent 40%),
    radial-gradient(circle at 80% 20%, #fde04722 0%, transparent 45%),
    linear-gradient(135deg, var(--red1), var(--red2));
}

/* Hoa Tết */
body::before{
  content:"🌸 🌼 🌸 🌼 🌸 🌼 🌸 🌼 🌸 🌼";
  position:absolute;
  top:15px;
  width:100%;
  text-align:center;
  font-size:26px;
  opacity:.4;
}

.card{
  width:min(650px,92vw);
  background:rgba(120,0,0,.88);
  border:2px solid var(--gold);
  border-radius:24px;
  padding:28px;
  text-align:center;
  box-shadow:0 0 40px #facc1544;
  position:relative;
}

h1{
  color:var(--gold);
  margin:0 0 10px;
}

.range{
  font-size:14px;
  opacity:.8;
  margin-bottom:18px;
}

/* Bao lì xì */
.envelope-wrapper{
  position:relative;
  width:140px;
  height:180px;
  margin:0 auto 16px;
  perspective:1000px;
}

.envelope{
  width:100%;
  height:100%;
  background:linear-gradient(145deg,#b91c1c,#dc2626);
  border:3px solid var(--gold);
  border-radius:12px;
  position:relative;
  cursor:pointer;
  transition:transform .25s ease;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
}

/* Chữ trên bao */
.envelope .seal{
  font-size:36px;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));
}

.envelope:hover{
  transform:scale(1.05);
}

/* Nắp bao */
.flap{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:55%;
  background:#991b1b;
  border-bottom:2px solid var(--gold);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;
  transition:transform .65s ease;
  z-index:3;
}

/* Tờ "quẻ" bên trong */
.paper{
  position:absolute;
  left:50%;
  bottom:14px;
  transform:translateX(-50%) translateY(70px);
  width:78%;
  height:78%;
  border-radius:12px;
  background:linear-gradient(180deg, #fff7ed, #fde68a);
  box-shadow:0 10px 25px rgba(0,0,0,.35);
  z-index:1;
  opacity:0;
  transition:transform .65s ease, opacity .45s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#7f1d1d;
  font-weight:900;
  letter-spacing:.5px;
  font-size:18px;
}

/* Confetti đơn giản */
.confetti{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  z-index:4;
}

@keyframes confettiPop{
  0%{ transform:scale(.7); opacity:0; }
  20%{ opacity:1; }
  100%{ transform:scale(1.2); opacity:0; }
}

.confetti.show{
  animation:confettiPop .9s ease forwards;
}

/* Rung nhẹ */
@keyframes shake{
  0%{transform:rotate(0deg);}
  25%{transform:rotate(2deg);}
  50%{transform:rotate(-2deg);}
  75%{transform:rotate(1deg);}
  100%{transform:rotate(0deg);}
}
.envelope.shake{
  animation:shake .38s ease;
}

/* Khi mở */
.envelope.open .flap{
  transform:rotateX(180deg);
}
.envelope.open + .paper{
  transform:translateX(-50%) translateY(-8px);
  opacity:1;
}

/* Quẻ (hiển thị kiểu gõ chữ) */
.wish{
  font-size:20px;
  margin:16px 0 10px;
  min-height:80px;
  line-height:1.35;
}

/* Phần giải quẻ */
.detail{
  margin-top:10px;
  padding:12px 14px;
  border-radius:16px;
  border:1px solid #fde04755;
  background:rgba(255,255,255,.06);
  font-size:15px;
  line-height:1.55;
  color:#fde68a;
  white-space:pre-line;
  opacity:0;
  transform:translateY(6px);
  transition:opacity .45s ease, transform .45s ease;
  text-align:left;
}
.detail.show{
  opacity:1;
  transform:translateY(0);
}

/* Nút */
button{
  background:linear-gradient(45deg,#fde047,#facc15);
  border:none;
  padding:14px 22px;
  border-radius:16px;
  font-weight:bold;
  cursor:pointer;
  font-size:16px;
  color:#7f1d1d;
  transition:.2s;
}
button:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #fde047;
}

/* Ảnh troll */
.troll-img{
  margin-top:12px;
  min-height:220px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.troll-img img{
  max-width:100%;
  max-height:240px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
  display:none;
  animation: pop .3s ease;
}
@keyframes pop{
  from{ transform:scale(.7); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}

/* Gợi ý nhỏ */
.hint{
  font-size:13px;
  opacity:.75;
  margin-top:6px;
}

/* Con trỏ nhấp nháy cho hiệu ứng gõ */
.cursor{
  display:inline-block;
  width:10px;
  margin-left:2px;
  animation: blink 1s step-end infinite;
}
@keyframes blink{
  50%{ opacity:0; }
}
</style>
</head>

• Tình cảm & sức khỏe: Tâm trạng tốt kéo vận tốt; nhớ cảm ơn.

• Lời nhắc: Bạn càng tự do, càng hấp dẫn.`,

• Công việc: Có việc khó; bạn là người “gánh team” nhưng cũng nhờ đó bật lên.
• Tài chính: Kiên nhẫn giữ kế hoạch; đừng đổi hướng vì một tháng xấu.
• Tình cảm & sức khỏe: Đừng cứng quá; kiên cường cũng cần mềm mại.
• Lời nhắc: Bạn sinh ra để vượt qua, không phải để than hoài.`,

`🔎 Giải quẻ 29 – Tái Sinh

• Công việc: Hợp đổi môi trường/đổi cách làm để “lột xác”.
• Tài chính: Tối ưu chi tiêu, cắt rò rỉ; bạn giữ tiền tốt hơn hẳn.
• Tình cảm & sức khỏe: Dứt khoát với mối quan hệ kéo tụt năng lượng.
• Lời nhắc: Đổi thói quen là đổi vận.`,

`🔎 Giải quẻ 30 – Ổn Định Tài Chính
• Tổng quan: Bạn biết cân đối thu chi, đỡ áp lực.
• Công việc: Thu nhập ổn định; hợp làm dài hạn và nâng kỹ năng.
• Tài chính: Nên dùng 2 tài khoản: chi tiêu & tiết kiệm; tự động chuyển tiền.
• Tình cảm & sức khỏe: Bớt căng vì tiền -> dễ thương hơn hẳn.
• Lời nhắc: Ổn định là nền của tự do.`,

`🔎 Giải quẻ 31 – Trời Quang Sau Mưa
• Tổng quan: Chuyện khó chịu sẽ qua, nhẹ đầu dần.
• Công việc: Những vướng mắc được tháo; bạn làm việc trôi hơn.
• Tài chính: Dần ổn lại sau giai đoạn “rò rỉ”.
• Tình cảm & sức khỏe: Tâm trạng sáng hơn; tránh ôm chuyện cũ.
• Lời nhắc: Mưa tạnh rồi, đừng đứng dưới mưa nữa.`,

`🔎 Giải quẻ 32 – Yêu Thương Đủ Đầy

• Công việc: Đồng đội/hợp tác dễ chịu; môi trường bớt toxic.
• Tài chính: Có người hỗ trợ hoặc cơ hội đến từ sự giúp đỡ qua lại.
• Tình cảm & sức khỏe: Tình cảm đẹp khi bạn nói thẳng điều mình cần.
• Lời nhắc: Nhận yêu thương không làm bạn yếu—nó làm bạn đủ.`,

`🔎 Giải quẻ 33 – Định Hướng Rõ Ràng
• Tổng quan: Bạn “đã biết mình muốn gì”.
• Công việc: Quyết đoán hơn; chọn dự án đúng hướng dài hạn.
• Tài chính: Tiền phục vụ mục tiêu; bớt tiêu theo cảm xúc.
• Tình cảm & sức khỏe: Không còn mập mờ; bạn chọn người cùng đường.
• Lời nhắc: Rõ hướng là bớt khổ.`,

`🔎 Giải quẻ 34 – Sức Mạnh Nội Tâm
• Tổng quan: Bạn học cách tự đứng vững, không lệ thuộc lời khen/chê.
• Công việc: Làm việc chắc tay; ít bị lung lay bởi drama.
• Tài chính: Kiên trì kế hoạch; đừng “đánh cược” chỉ vì người khác nói.
• Tình cảm & sức khỏe: Bớt kỳ vọng sai; lòng nhẹ, ngủ ngon.
• Lời nhắc: Nội lực mạnh thì ngoại cảnh không dắt bạn đi.`,

`🔎 Giải quẻ 35 – Thuận Dòng
• Tổng quan: Mọi việc trôi tự nhiên khi bạn thôi cưỡng.
• Công việc: Gặp thời điểm tốt; cứ làm đúng nhịp sẽ ra kết quả.
• Tài chính: Thu nhập đều; tránh “tham thêm” gây rối.
• Tình cảm & sức khỏe: Tâm yên thì cơ thể êm.
• Lời nhắc: Đừng bơi ngược khi dòng đang đưa bạn tới đúng chỗ.`,

`🔎 Giải quẻ 36 – Chìa Khóa Thành Công
• Tổng quan: Kỷ luật mở cửa lớn.
• Công việc: Hợp xây routine: giờ làm sâu, giờ học, giờ nghỉ.
• Tài chính: Kỷ luật chi tiêu/đầu tư giúp bạn tăng tốc rõ.
• Tình cảm & sức khỏe: Kỷ luật không phải khắt khe—là yêu mình đủ.
• Lời nhắc: Bạn không thiếu tài năng, bạn thiếu lịch.`,

`🔎 Giải quẻ 37 – Chữa Lành
• Tổng quan: Bạn tha thứ cho quá khứ và ngừng tự phạt mình.
• Công việc: Làm tốt hơn khi không còn sợ sai.
• Tài chính: Chi cho trị liệu/du lịch/hoạt động chữa lành là hợp lý, nhưng có giới hạn.
• Tình cảm & sức khỏe: Buông gánh nặng cảm xúc giúp sức khỏe lên.
• Lời nhắc: Chữa lành không xóa quá khứ—nó đổi cách bạn sống với nó.`,

`🔎 Giải quẻ 38 – Bứt Phá
• Tổng quan: Một bước táo bạo đem lại kết quả lớn.
• Công việc: Dám nhận thử thách/đổi vai trò; đây là “cú nhảy”.
• Tài chính: Có thể tăng thu mạnh; nhưng nhớ quản trị rủi ro.
• Tình cảm & sức khỏe: Bận rộn hơn; giữ sức để bứt phá bền.
• Lời nhắc: Can đảm đúng lúc = vận mở.`,

`🔎 Giải quẻ 39 – Sáng Tạo
• Tổng quan: Tài năng tiềm ẩn được đánh thức.
• Công việc: Hợp làm nội dung/thiết kế/ý tưởng/giải pháp; bạn “bật mode sáng”.
• Tài chính: Kiếm thêm từ sản phẩm sáng tạo/dịch vụ cá nhân.
• Tình cảm & sức khỏe: Sáng tạo cần năng lượng; ngủ và ăn đều.
• Lời nhắc: Đừng đợi cảm hứng—hãy tạo điều kiện cho nó.`,

`🔎 Giải quẻ 40 – Viết Lại Câu Chuyện
• Tổng quan: Bạn có quyền đổi hướng.
• Công việc: Dám rẽ sang con đường phù hợp hơn, kể cả bắt đầu lại một phần.
• Tài chính: Đầu tư cho chuyển hướng (học, công cụ) là đáng—nhưng có kế hoạch.
• Tình cảm & sức khỏe: Bạn bỏ vai “người chịu đựng”; sống đúng mình hơn.
• Lời nhắc: Đời bạn, kịch bản bạn viết.`,

`🔎 Giải quẻ 41 – Ánh Sáng
• Tổng quan: Niềm tin giúp bạn vượt nghi ngờ.
• Công việc: Có lúc bị hoài nghi, nhưng làm tới cùng sẽ có người công nhận.
• Tài chính: Đừng tự hạn chế vì sợ thiếu; cứ làm tốt thì tiền sẽ theo.
• Tình cảm & sức khỏe: Tránh tự nói xấu bản thân.
• Lời nhắc: Tin mình là bật đèn cho cả năm.`,

`🔎 Giải quẻ 42 – Troll Nhẹ Nhàng
• Tổng quan: Tiền tới rồi đi… nhưng ít nhất nó không block bạn 😆
• Công việc: Thu nhập có nhưng chi cũng nhiều; quản lý dòng tiền là chìa khóa.
• Tài chính: Dùng ngân sách theo tuần + giới hạn mua sắm bốc đồng.
• Tình cảm & sức khỏe: Đừng cáu vì “hết tiền”; cáu xong vẫn hết 😌
• Lời nhắc: Tiền thích người bình tĩnh.`,

`🔎 Giải quẻ 43 – Nở Hoa
• Tổng quan: Công sức âm thầm được ghi nhận.
• Công việc: Bạn có thể được khen thưởng/đề bạt; hoặc ít nhất là được tin giao việc lớn.
• Tài chính: Thu nhập tăng vì giá trị tăng.
• Tình cảm & sức khỏe: Đừng ngại nhận lời khen; đó là “lộc”.
• Lời nhắc: Đến mùa, hoa tự nở.`,

`🔎 Giải quẻ 44 – Nuôi Dưỡng
• Tổng quan: Ước mơ như cây nhỏ—chăm đều mới lớn.
• Công việc: Làm từng bước: chuẩn hóa, tích lũy, nâng chất.
• Tài chính: Tốt cho kế hoạch dài hạn; tránh “đốt giai đoạn”.
• Tình cảm & sức khỏe: Nuôi dưỡng bản thân trước khi nuôi người khác.
• Lời nhắc: Không cần nhanh, cần đều.`,

`🔎 Giải quẻ 45 – Hành Trình
• Tổng quan: Đừng so mình với người khác; mỗi người có timeline riêng.
• Công việc: Tập trung đường dài; bạn thắng nhờ bền.
• Tài chính: So sánh dễ làm bạn tiêu bừa/đầu tư sai; giữ nguyên tắc.
• Tình cảm & sức khỏe: Bớt mạng xã hội một chút sẽ nhẹ đầu.
• Lời nhắc: Bạn không chậm—bạn đang đi đúng nhịp.`,

`🔎 Giải quẻ 46 – Bao Dung
• Tổng quan: Tha thứ giúp bạn tự do.
• Công việc: Bớt tranh đúng sai; tập trung giải pháp, bạn được nể hơn.
• Tài chính: Bao dung không đồng nghĩa cho vay vô hạn 😌 Rõ ràng tiền bạc.
• Tình cảm & sức khỏe: Nói điều cần nói, rồi buông điều không cần giữ.
• Lời nhắc: Tha thứ là thả neo khỏi quá khứ.`,

`🔎 Giải quẻ 47 – Tầm Nhìn Lớn
• Tổng quan: Nghĩ xa hơn, đi xa hơn.
• Công việc: Hợp làm chiến lược/kế hoạch; bạn nhìn được “bức tranh lớn”.
• Tài chính: Đầu tư dài hạn hợp hơn lướt sóng.
• Tình cảm & sức khỏe: Đừng yêu/đừng sống kiểu ngắn hạn rồi đau dài hạn.
• Lời nhắc: Tầm nhìn là la bàn của vận.`,

`🔎 Giải quẻ 48 – Thành Tựu
• Tổng quan: Một mục tiêu lớn hoàn thành.
• Công việc: Khả năng “đóng dự án” rất cao; bạn gặt thành tích rõ rệt.
• Tài chính: Thành tựu thường đi kèm tiền; nhưng đừng phung phí vì hưng phấn.
• Tình cảm & sức khỏe: Ăn mừng vừa đủ; giữ sức cho chặng tiếp.
• Lời nhắc: Bạn làm được—đừng quên tự công nhận mình.`,

`🔎 Giải quẻ 49 – Cơ Hội
• Tổng quan: Một lời đề nghị mới đáng cân nhắc.
• Công việc: Đọc kỹ điều khoản; hỏi rõ KPI, quyền lợi, trách nhiệm.
• Tài chính: Có thể tăng thu; nhưng cũng có chi phí cơ hội—cân bằng.
• Tình cảm & sức khỏe: Đừng nhận vì sĩ diện; nhận vì phù hợp.
• Lời nhắc: Cơ hội tốt là cơ hội rõ.`,

`🔎 Giải quẻ 50 – Gieo Hạt
• Tổng quan: Việc hôm nay làm sẽ nở hoa mai sau.
• Công việc: Xây hệ thống, quy trình, thương hiệu cá nhân—đây là “hạt”.
• Tài chính: Tiết kiệm/đầu tư đều đặn; lợi nhuận đến từ thời gian.
• Tình cảm & sức khỏe: Gieo thói quen tốt; thu sức khỏe tốt.
• Lời nhắc: Hạt nhỏ nhưng mùa lớn.`,

`🔎 Giải quẻ 51 – Cân Bằng
• Tổng quan: Giữ cân bằng là giữ được tất cả.
• Công việc: Đừng cực đoan: không “cày 24/7” cũng không “thả trôi”.
• Tài chính: Chi tiêu cân bằng: vui sống nhưng có quỹ an toàn.
• Tình cảm & sức khỏe: Cân bằng cảm xúc; bớt nóng bớt mệt.
• Lời nhắc: Bền là nhờ cân.`,

`🔎 Giải quẻ 52 – Nhẹ Nhàng
• Tổng quan: Không cần ồn ào vẫn có giá trị.
• Công việc: Bạn hợp “làm chắc”; ít nói nhiều làm.
• Tài chính: Tiền đến từ sự ổn định; tránh khoe/đốt tiền vì sĩ diện.
• Tình cảm & sức khỏe: Người hợp bạn là người khiến bạn yên, không khiến bạn gồng.
• Lời nhắc: Nhẹ nhàng nhưng không yếu.`,

`🔎 Giải quẻ 53 – Đúng Thời Điểm
• Tổng quan: Mọi thứ đến khi bạn sẵn sàng.
• Công việc: Đừng nóng; chuẩn bị kỹ thì thời điểm đẹp tự xuất hiện.
• Tài chính: Tránh mua/đầu tư lúc nôn; chờ “đúng nhịp”.
• Tình cảm & sức khỏe: Tình cảm cũng vậy—đúng người đúng lúc.
• Lời nhắc: Chuẩn bị là cách gọi may mắn.`,

`🔎 Giải quẻ 54 – Vươn Lên
• Tổng quan: Bạn không còn sợ thất bại.
• Công việc: Dám thử, dám sai, dám sửa—đó là công thức thăng tiến.
• Tài chính: Có thể tăng thu nếu bạn dám nhận thêm trách nhiệm.
• Tình cảm & sức khỏe: Tự tin hơn kéo khí sắc lên.
• Lời nhắc: Sợ ít đi, đường nhiều lên.`,

`🔎 Giải quẻ 55 – Troll Dễ Thương
• Tổng quan: Giảm cân thành công… giảm tiền trong ví trước 🤣
• Công việc: Nhiều khoản chi vì công việc/đời sống; nhưng bạn học cách xoay xở.
• Tài chính: Cẩn thận “rớt ví” kiểu phát sinh; lập quỹ phát sinh 10%.
• Tình cảm & sức khỏe: Đừng stress; vui vẻ là lời.
• Lời nhắc: Tiền ít nhưng bài học nhiều—cũng là lời.`,

`🔎 Giải quẻ 56 – Dịu Dàng
• Tổng quan: Mềm mỏng giúp bạn thắng.
• Công việc: Giao tiếp khéo, đàm phán tốt; bạn giải quyết được việc khó bằng thái độ.
• Tài chính: Lợi trong thương lượng; có thể chốt deal tốt.
• Tình cảm & sức khỏe: Dịu dàng với người khác và với chính mình.
• Lời nhắc: Nước mềm mà xuyên đá.`,

`🔎 Giải quẻ 57 – Thấu Hiểu
• Tổng quan: Bạn hiểu mình hơn: mình muốn gì, chịu được gì, cần gì.
• Công việc: Chọn việc hợp tính; bớt “đi ngược bản chất”.
• Tài chính: Biết điểm yếu tiêu tiền; bạn kiểm soát tốt hơn.
• Tình cảm & sức khỏe: Tự hiểu mình thì ít trách người.
• Lời nhắc: Hiểu mình là thắng lớn.`,

`🔎 Giải quẻ 58 – Niềm Vui Nhỏ
• Tổng quan: Hạnh phúc đến từ điều giản dị.
• Công việc: Đừng coi thường việc nhỏ; nó làm tinh thần bạn tốt lên.
• Tài chính: Niềm vui rẻ mà chất: một bữa ngon, một chuyến đi gần.
• Tình cảm & sức khỏe: Chăm những thứ nhỏ: ngủ, nước, ánh nắng.
• Lời nhắc: Vui nhỏ nhưng đều = vui lớn.`,

`🔎 Giải quẻ 59 – Tập Trung
• Tổng quan: Bớt phân tâm, tăng hiệu quả.
• Công việc: Tắt thông báo khi làm sâu; mỗi ngày 1 khung “deep work”.
• Tài chính: Tập trung mục tiêu tiền; tránh đầu tư/chi tiêu theo trend.
• Tình cảm & sức khỏe: Tập trung vào người thật, việc thật.
• Lời nhắc: Tập trung là siêu năng lực.`,

`🔎 Giải quẻ 60 – Linh Hoạt
• Tổng quan: Biết thích nghi là lợi thế.
• Công việc: Kế hoạch có thể đổi; bạn càng linh hoạt càng ít đau đầu.
• Tài chính: Có thể thay đổi cách kiếm tiền; đa nguồn thu là tốt.
• Tình cảm & sức khỏe: Linh hoạt nhưng giữ nguyên nguyên tắc cốt lõi.
• Lời nhắc: Cây cứng dễ gãy, cây dẻo thì sống.`,

`🔎 Giải quẻ 61 – Ổn Định
• Tổng quan: Bạn xây được nền tảng vững.
• Công việc: Hợp ổn định vị trí, nâng cấp năng lực; xây uy tín dài hạn.
• Tài chính: Tích lũy tốt; ưu tiên an toàn trước mạo hiểm.
• Tình cảm & sức khỏe: Nếp sống đều làm bạn “đẹp lên” rõ.
• Lời nhắc: Nền vững thì nhà cao.`,

`🔎 Giải quẻ 62 – Tình Yêu Chân Thành
• Tổng quan: Người ở lại là người đáng giữ.
• Công việc: Bận nhưng không cô đơn; có người đồng hành tinh thần.
• Tài chính: Chi tiêu cho tình yêu hợp lý; rõ ràng để tránh hiểu lầm.
• Tình cảm & sức khỏe: Chân thành + thẳng thắn = bền.
• Lời nhắc: Giữ người tốt bằng sự tử tế, không phải bằng kiểm soát.`,

`🔎 Giải quẻ 63 – Tỏa Sáng Âm Thầm
• Tổng quan: Bạn không cần chứng minh nhiều; kết quả tự nói.
• Công việc: Làm chắc, làm kỹ; bạn được tin vào việc quan trọng.
• Tài chính: Thu tăng nhờ năng lực; bớt khoe thì giữ được tiền.
• Tình cảm & sức khỏe: Bình yên là đẹp nhất.
• Lời nhắc: Đỉnh cao đôi khi rất yên.`,

`🔎 Giải quẻ 64 – Phát Triển
• Tổng quan: Bước nhỏ tạo thay đổi lớn.
• Công việc: Mỗi tháng đặt 1 mục tiêu phát triển; cuối năm bạn khác hẳn.
• Tài chính: Tăng thu/tăng kỹ năng; ưu tiên tích lũy.
• Tình cảm & sức khỏe: Trưởng thành khiến bạn bớt dính vào chuyện không đáng.
• Lời nhắc: Nhỏ nhưng liên tục là mạnh.`,

`🔎 Giải quẻ 65 – Bình Yên
• Tổng quan: Sự yên ổn là phần thưởng.
• Công việc: Đừng tự tạo drama; chọn môi trường và cách làm “êm”.
• Tài chính: Bình yên tài chính đến từ dự phòng và kỷ luật.
• Tình cảm & sức khỏe: Biết đủ là giàu.
• Lời nhắc: Bình yên không tự đến—bạn phải chọn nó.`,

`🔎 Giải quẻ 66 – Tài Lộc Tăng Dần
• Tổng quan: Thu nhập cải thiện rõ.
• Công việc: Có cơ hội tăng lương/đổi job tốt hơn/nhận thêm dự án.
• Tài chính: Năm hợp tích sản; ưu tiên quỹ dự phòng + đầu tư dài hạn.
• Tình cảm & sức khỏe: Có tiền hơn nhưng đừng “cày kiệt”; giữ sức.
• Lời nhắc: Tăng thu mà không tăng tiêu mới là đỉnh.`,

`🔎 Giải quẻ 67 – Hoàn Thành
• Tổng quan: Bạn đạt điều từng nghĩ xa vời.
• Công việc: Dự án/thi cử/chứng chỉ/goal lớn có khả năng “về đích”.
• Tài chính: Về đích thường đi kèm phần thưởng; nhớ chốt lời và giữ lại.
• Tình cảm & sức khỏe: Ăn mừng có kế hoạch; đừng đốt sức.
• Lời nhắc: Bạn tới đây không phải tình cờ.`,

`🔎 Giải quẻ 68 – Nhẹ Nhàng Đón Nhận

• Công việc: Làm đúng phần mình, không tranh công; người khác sẽ thấy.

`🔎 Giải quẻ 69 – Troll Kết Sổ
• Tổng quan: Nếu quẻ nào không trúng… thì trúng chắc 1 điều: bạn còn cơ hội làm lại 😌
• Công việc: Năm nay có lúc lỡ nhịp; nhưng bạn quay lại đường đúng rất nhanh.
• Tài chính: Có lúc hụt; nhưng bạn rút kinh nghiệm, càng về sau càng ổn.
• Tình cảm & sức khỏe: Đừng tự trách; đời cho bạn “reset” nhiều lần.
• Lời nhắc: Quan trọng là bạn không bỏ cuộc.`
];

let typingTimer = null;

/* Key lưu “đã gieo” */
const STORAGE_KEY = "fortune_once_v1";

function getSavedFortune(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(typeof data?.index !== "number") return null;
    return data;
  }catch(e){
    return null;
  }
}

function saveFortune(index){
  const data = { index, savedAt: new Date().toISOString() };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function resetDetail(){
  const detailEl = document.getElementById("detailText");
  detailEl.classList.remove("show");
  detailEl.textContent = "";
}

/* Hiển thị quẻ với hiệu ứng gõ chữ */
function typeText(fullText, onDone){
  const textEl = document.getElementById("wishText");
  textEl.innerHTML = `<span id="typed"></span><span class="cursor">|</span>`;
  const typedEl = document.getElementById("typed");

  let i = 0;
  if (typingTimer) clearInterval(typingTimer);

  typingTimer = setInterval(()=>{
    typedEl.textContent = fullText.slice(0, i + 1);
    i++;
    if(i >= fullText.length){
      clearInterval(typingTimer);
      typingTimer = null;
      if(onDone) onDone();
    }
  }, 25);
}

/* Hiển thị meme theo index + show giải quẻ */
function showImageAndDetail(index){
  const img = document.getElementById("trollImage");
  const imageIndex = index % trollImages.length;
  img.src = trollImages[imageIndex];
  img.style.display = "block";

  const detailEl = document.getElementById("detailText");
  detailEl.textContent = wishDetails[index] || "🔎 (Chưa có giải quẻ cho quẻ này)";
  detailEl.classList.add("show");
}

/* Mở bao + show quẻ */
function animateOpenThenShow(index){
  const envelope = document.getElementById("envelope");
  const paper = document.getElementById("paper");
  const confetti = document.getElementById("confetti");

  resetDetail();

  envelope.classList.remove("open");
  paper.style.opacity = 0;
  confetti.classList.remove("show");

  envelope.classList.add("shake");

  setTimeout(()=>{
    envelope.classList.remove("shake");
    envelope.classList.add("open");
    confetti.classList.add("show");

    setTimeout(()=>{
      paper.style.opacity = 1;
      paper.textContent = "QUẺ";

      const fullText = wishes[index];
      typeText(fullText, ()=> showImageAndDetail(index));
    }, 380);

  }, 380);
}

/* Bấm gieo: chỉ cho 1 lần */
function openEnvelope(){
  const saved = getSavedFortune();

  if(saved){
    const textEl = document.getElementById("wishText");
    textEl.innerHTML = "🛑 Bạn đã gieo quẻ rồi nha! Đừng tham, coi chừng ứng nghiệm 😌";
    animateOpenThenShow(saved.index);
    return;
  }

  const index = Math.floor(Math.random() * wishes.length);
  saveFortune(index);
  animateOpenThenShow(index);

  const btn = document.getElementById("btnFortune");
  if(btn){
    btn.disabled = true;
    btn.textContent = "Đã gieo quẻ ✅";
    btn.style.opacity = .85;
    btn.style.cursor = "not-allowed";
  }
}

window.addEventListener("load", ()=>{
  const saved = getSavedFortune();
  if(saved){
    const btn = document.getElementById("btnFortune");
    if(btn){
      btn.disabled = true;
      btn.textContent = "Đã gieo quẻ ✅";
      btn.style.opacity = .85;
      btn.style.cursor = "not-allowed";
    }
    // Nếu muốn tự show lại quẻ cũ khi load trang:
    // animateOpenThenShow(saved.index);
  }
});
</script>
